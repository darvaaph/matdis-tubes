  start_node: 0
  goal_node: 8
  events:
  - step: 1
    type: CONFLICT_NODE_TRIGGER
    target_node: 1
    time_wib: 18.15 WIB
    title: 'Pelepasan Pawai: Pintu Keluar Taman Prawatasari'
