      (Node 0) menuju Depan Taman Prawatasari (Node 1). Penyangga Surya Kencana Atas
      (Node 16) dikunci merah.
  - step: 2
    type: CONFLICT_NODE_TRIGGER
    target_node: 2
    time_wib: 18.25 WIB
    title: Manuver Perempatan Surya Kencana
    parade_nodes:
