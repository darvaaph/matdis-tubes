    - 1
    - 2
    description: Rombongan memasuki Perempatan Surya Kencana (Node 2) ke arah timur.
      Sekat barat Simpang KH. Abdullah (Node 9) dan sekat selatan Aria Cikondang (Node
      11) menahan arus kendaraan.
  - step: 3
    type: CONFLICT_NODE_TRIGGER
    target_node: 3
    time_wib: 18.35 WIB
    title: Belokan Masuk Koridor Jl. Siliwangi (Joglo Atas)
    parade_nodes:
    - 1
    - 2
    - 3
    description: Barisan obor tiba di Simpang Pangeran Hidayatullah - Siliwangi (Node
      3). Arus dari Simpang Aria Cikondang (Node 11) dan Adi Sucipta (Node 10) diblokir
      penuh.
  - step: 4
    type: CONFLICT_NODE_TRIGGER
    target_node: 4
    time_wib: 18.45 WIB
    title: Perlintasan Simpang Siliwangi - Adi Sucipta
    parade_nodes:
    - 2
    - 3
    - 4
    description: Pawai melintasi Simpang Siliwangi - Adi Sucipta (Node 4). Petugas
      Satlantas menutup akses Jl. Adi Sucipta (Node 10) agar tidak memotong koridor
      pawai.
  - step: 5
    type: CONFLICT_NODE_TRIGGER
    target_node: 5
    time_wib: 18.55 WIB
    title: Penanganan Simpang Siliwangi - Slamet Riyadi
    parade_nodes:
    - 3
    - 4
    - 5
    description: Rombongan melewati Simpang Slamet Riyadi (Node 5). Akses kendaraan
      warga yang hendak menembus ke Simpang Gg. Mawar - Mangunsarkoro (Node 17) ditahan.
  - step: 6
    type: CONFLICT_NODE_TRIGGER
    target_node: 6
    time_wib: 19.05 WIB
    title: Sterilisasi Mulut Gang Pemukiman Gg. Mawar
    parade_nodes:
    - 4
    - 5
    - 6
    description: Meski hujan mulai turun pukul 19.05 WIB, barisan obor terus bergerak
      melewati Simpang Siliwangi - Gg. Mawar (Node 6). Motor warga dari Gg. Mawar
      (Node 17) dilarang menyebrang.
  - step: 7
    type: CONFLICT_NODE_TRIGGER
    target_node: 7
    time_wib: 19.15 WIB
    title: 'Simpul Kritis Utama: Simpang Tugu Tauhid'
    parade_nodes:
    - 5
    - 6
    - 7
    description: Rombongan Pawai Obor tiba di Simpang Siliwangi - Siti Jenab / Tugu
      Tauhid (Node 7, derajat konflik tertinggi deg=5) yang berbatasan langsung dengan
      Masjid Agung (Node 19), Gg. Al Ianah (Node 18), dan Otista (Node 13)!
  - step: 8
    type: CONFLICT_NODE_TRIGGER
    target_node: 8
    time_wib: 19.30 WIB
    title: 'Ketibaan Finish: Pendopo Pemda & Istigasah Kubra'
    parade_nodes:
