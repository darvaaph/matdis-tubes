case_id: case_10_pawai_obor
title: 'Pengaturan Arus Lalu Lintas: Pawai Obor & Istigasah Kubra Kota Cianjur'
description: Skenario N=20 berbasis Graph Coloring / Conflict Scheduling di pusat
  Kota Cianjur. Rombongan pawai obor bergerak dari Taman Prawatasari (Node 0) menuju
  Pendopo Pemda Cianjur (Node 8) melintasi koridor Jl. Siliwangi dan Simpang Tugu
  Tauhid, menuntut alokasi slot waktu (color/time-slot) bebas konflik terhadap titik
  penutupan, jalan sirip, gang warga, dan area penonton.
